[package]
name = "lokii-core"
version = "0.2.0"
edition = "2021"

[lib]
name = "lokii_core"
crate-type = ["staticlib", "lib"]

[features]
default = []
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
uniffi = { version = "0.29", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
bitcode = { version = "0.6", features = ["derive"] }
toml = "0.9"
dirs = "6"
glob-match = "0.2"
regex = "1"
nucleo-matcher = "0.3"
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
unicode-segmentation = "1.13"
fsevent-sys = "4"
libc = "0.2"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bin]]
name = "lokii"
path = "src/bin/lokii.rs"

[dev-dependencies]
tempfile = "3"
