name: Lokii
options:
  bundleIdPrefix: com.lokii
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.4.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  Lokii:
    type: application
    platform: macOS
    sources:
      - path: Lokii
        excludes:
          - "*.xcassets/*/.*"
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    preBuildScripts:
      - name: Build Rust Core
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # 确保环境变量覆盖常见 cargo 与 rustup 安装路径
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"

          # 自动提取 Xcode 传入的目标架构，动态映射 Rust target
          ARCH="${CURRENT_ARCH:-${ARCHS:-$(uname -m)}}"
          case "$ARCH" in
            arm64*)  RUST_TARGET="aarch64-apple-darwin" ;;
            x86_64*) RUST_TARGET="x86_64-apple-darwin" ;;
            *)       RUST_TARGET="aarch64-apple-darwin" ;;
          esac

          cd "$SRCROOT/.."
          cargo build -p lokii-core --lib --release --target "$RUST_TARGET"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lokii.app
        PRODUCT_NAME: Lokii
        INFOPLIST_FILE: Lokii/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/LokiiCore/Headers"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../target/aarch64-apple-darwin/release"
          - "$(SRCROOT)/../target/x86_64-apple-darwin/release"
        OTHER_LDFLAGS:
          - "-llokii_core"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        ARCHS: "$(ARCHS_STANDARD)"
    entitlements:
      path: Lokii/Lokii.entitlements
      properties:
        com.apple.security.app-sandbox: false
